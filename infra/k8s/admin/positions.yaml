apiVersion: apps/v1
kind: Deployment
metadata:
  name: positions
  namespace: admin-namespace
  labels:
    app: positions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: positions
  template:
    metadata:
      labels:
        app: positions
    spec:
      containers:
        - name: positions
          image: delivery-system/positions:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: positions-hpa
  namespace: admin-namespace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: positions
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
